[project]
name = "research-os"
version = "0.1.0"
description = "A deterministic local research repository for professor and lab pages"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "pymupdf>=1.28.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
research-os = "research_os.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
