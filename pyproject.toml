[project]
name = "research-os"
version = "0.1.0"
description = "Local-first Master OS and deterministic research repository for NYCU NLP Lab"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pymupdf>=1.28.0",
    "tzdata>=2025.1",
    "uvicorn>=0.52.4",
]

[project.scripts]
research-os = "research_os.cli:main"
master-os = "master_os.cli:main"
master-os-setup = "master_os.setup_cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_os", "src/master_os"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
