<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="以證據為核心的研究導航、閱讀路徑與論文工作台。">
  <title>Research OS｜研究工作台</title><link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">跳至主要內容</a>
<aside class="sidebar">
  <a class="brand" href="#overview"><span class="brand-mark">R</span><span>Research OS<small>研究工作台</small></span></a>
  <nav aria-label="主要導覽">
    <button class="nav-item active" data-view="overview">總覽</button>
    <button class="nav-item" data-view="map">研究地圖</button>
    <button class="nav-item" data-view="path">閱讀路徑</button>
    <button class="nav-item" data-view="workspace">論文工作台</button>
    <button class="nav-item" data-view="opportunities">研究機會</button>
    <button class="nav-item" data-view="library">論文庫</button>
    <button class="nav-item" data-view="discovery">學術探索</button>
  </nav>
  <div class="corpus-mini"><span class="status-dot"></span><span>Corpus 已連線<small id="generated-at"></small></span></div>
</aside>
<div class="shell">
  <header class="topbar"><button id="menu" aria-label="開啟導覽">選單</button><div id="breadcrumb">總覽</div><label class="global-search"><span>搜尋</span><input id="search" type="search" placeholder="論文、方法、資料集…"></label></header>
  <main id="main" tabindex="-1">
    <section id="view-overview" class="view active"></section>
    <section id="view-map" class="view"></section>
    <section id="view-path" class="view"></section>
    <section id="view-workspace" class="view"></section>
    <section id="view-opportunities" class="view"></section>
    <section id="view-library" class="view"></section>
    <section id="view-discovery" class="view"></section>
  </main>
</div>
<dialog id="evidence-dialog"><button class="dialog-close" aria-label="關閉">關閉</button><div id="evidence-content"></div></dialog>
<script src="data.js"></script><script src="app.js"></script>
</body></html>
